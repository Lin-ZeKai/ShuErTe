<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f0f4ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>舒尔特方格 · 专注力训练</title>
  <style>
    :root {
      --bg-page: #eef2f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --accent: #2563eb;
      --cell-pink: #ff5e7e;
      --cell-yellow: #fce36a;
      --cell-blue: #76c6ff;
      --cell-white: #ffffff;
      --shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
      --radius-card: 18px;
      --radius-inner: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(165deg, #f8fafc 0%, #eef2f9 45%, #e8f0fe 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      padding-top: max(12px, var(--safe-top));
      padding-bottom: max(16px, var(--safe-bottom));
      touch-action: manipulation;
    }

    .app {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .screen.hidden {
      display: none !important;
    }

    /* —— 选择页 —— */
    .screen-menu {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 8px 4px 24px;
    }

    .screen-menu h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 1.85rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
    }

    .menu-desc {
      margin: -8px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .menu-field label {
      display: block;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .menu-field select {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      background: var(--card);
      box-shadow: var(--shadow);
      min-height: 48px;
      touch-action: manipulation;
    }

    .menu-best {
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      padding: 12px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }

    .menu-best strong {
      color: var(--accent);
    }

    .btn-primary {
      width: 100%;
      min-height: 52px;
      padding: 16px 20px;
      font-size: 1.08rem;
      font-weight: 800;
      color: #fff;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      background: linear-gradient(180deg, #3b82f6, #2563eb);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
      touch-action: manipulation;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .menu-tip {
      margin: 0;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    /* —— 游戏页 —— */
    .screen-game {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .game-header {
      display: grid;
      grid-template-columns: minmax(64px, auto) 1fr minmax(72px, auto);
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }

    .btn-back {
      justify-self: start;
      min-height: 44px;
      min-width: 44px;
      padding: 0 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #dbeafe;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-back:active {
      transform: scale(0.97);
    }

    .timer-box {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: clamp(1.1rem, 3.8vw, 1.35rem);
      letter-spacing: 0.02em;
    }

    .best-box {
      justify-self: end;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: right;
      line-height: 1.25;
      max-width: 110px;
    }

    .best-box strong {
      color: var(--accent);
      font-weight: 800;
      display: block;
      font-size: 0.82rem;
    }

    .next-target {
      background: linear-gradient(135deg, #fff, #f0f7ff);
      border: 1px solid #e0e7ff;
      border-radius: var(--radius-card);
      padding: 14px 16px;
      text-align: center;
      font-size: clamp(1.05rem, 3.4vw, 1.28rem);
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .next-target span {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .grid-wrap {
      position: relative;
      background: var(--card);
      border-radius: var(--radius-card);
      padding: 10px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: min(100%, 400px);
      margin: 0 auto;
    }

    .grid {
      display: grid;
      gap: 0;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-inner);
      overflow: hidden;
      border: none;
      background: transparent;
      isolation: isolate;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      font-size: clamp(0.62rem, calc(min(92vw, 400px) / var(--n, 4) * 0.42), 2rem);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s ease;
      border: none;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 0;
      box-shadow: none;
      outline: none;
    }

    .cell:focus-visible {
      z-index: 2;
      box-shadow: inset 0 0 0 2px rgba(37, 99, 235, 0.55);
    }

    .cell:active:not(.disabled) {
      transform: scale(0.97);
    }

    .cell.disabled {
      cursor: default;
      pointer-events: none;
    }

    .cell.error {
      outline: 3px solid #ef4444;
      outline-offset: -1px;
      z-index: 3;
      animation: shake 0.45s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      12% { transform: translateX(-10px); }
      25% { transform: translateX(10px); }
      37% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      62% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* 倒计时蒙层（覆盖在方格区域上） */
    .grid-mask {
      position: absolute;
      inset: 10px;
      border-radius: var(--radius-inner);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }

    .grid-mask.interactive {
      pointer-events: auto;
    }

    .grid-mask.hidden {
      display: none;
    }

    .grid-mask-art {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 85% 70% at 18% 28%, rgba(255, 94, 126, 0.42), transparent 58%),
        radial-gradient(ellipse 80% 65% at 82% 22%, rgba(118, 198, 255, 0.45), transparent 55%),
        radial-gradient(ellipse 75% 60% at 48% 88%, rgba(252, 227, 106, 0.38), transparent 52%),
        radial-gradient(ellipse 50% 45% at 72% 72%, rgba(167, 243, 208, 0.35), transparent 50%),
        linear-gradient(160deg, rgba(255, 255, 255, 0.78), rgba(248, 250, 252, 0.55));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .grid-mask-num {
      position: relative;
      z-index: 2;
      font-size: clamp(4.5rem, 22vw, 7rem);
      font-weight: 900;
      line-height: 1;
      color: rgba(71, 85, 105, 0.88);
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.9);
      letter-spacing: 0.02em;
      user-select: none;
      pointer-events: none;
    }

    .hint {
      text-align: center;
      font-size: 0.86rem;
      color: var(--muted);
      margin: 2px 0 0;
      padding: 0 4px;
    }

    .result-banner {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: #059669;
      min-height: 1.4em;
    }

    .btn-restart {
      width: 100%;
      min-height: 52px;
      padding: 16px 20px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(180deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.32);
      touch-action: manipulation;
    }

    .btn-restart:active {
      transform: scale(0.98);
    }

    .btn-restart:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <section id="screenMenu" class="screen screen-menu">
      <h1>舒尔特方格</h1>
      <p class="menu-desc">专注力训练 · 按 1 到 N 依次点按</p>
      <div class="menu-field">
        <label for="sizeSelect">方格尺寸</label>
        <select id="sizeSelect" aria-label="选择方格尺寸"></select>
      </div>
      <div class="menu-best" id="menuBest">该尺寸最佳：<strong>—</strong></div>
      <button type="button" class="btn-primary" id="btnStart">开始训练</button>
      <p class="menu-tip">
        手机使用：用 Safari / Chrome 打开本页即可；为更大显示区域可将手机横屏，或把页面「添加到主屏幕」后像 App 一样打开。
      </p>
    </section>

    <section id="screenGame" class="screen screen-game hidden">
      <header class="game-header">
        <button type="button" class="btn-back" id="btnBack">返回</button>
        <div class="timer-box" id="timerDisplay">00.00 秒</div>
        <div class="best-box" id="bestDisplay">本局尺寸最佳<br /><strong>—</strong></div>
      </header>

      <div class="next-target" id="nextTarget">
        <span id="nextLabel">下一个：</span><span id="nextNum">1</span>
      </div>

      <div class="grid-wrap">
        <div class="grid" id="grid" style="--n: 4"></div>
        <div class="grid-mask hidden interactive" id="gridMask" aria-hidden="true">
          <div class="grid-mask-art" aria-hidden="true"></div>
          <div class="grid-mask-num" id="maskCountdown">3</div>
        </div>
      </div>

      <p class="hint" id="hintText">以升序从 1 到最后一个数字依次点按</p>
      <div class="result-banner" id="resultBanner"></div>

      <button type="button" class="btn-restart" id="btnRestart">重新开始</button>
    </section>
  </div>

  <script>
    (function () {
      const SIZES = [3, 4, 5, 6, 7, 8];
      const PALETTE = [
        { bg: "var(--cell-pink)", fg: "#ffffff" },
        { bg: "var(--cell-yellow)", fg: "#111827" },
        { bg: "var(--cell-blue)", fg: "#ffffff" },
        { bg: "var(--cell-white)", fg: "#111827" },
      ];

      const screenMenu = document.getElementById("screenMenu");
      const screenGame = document.getElementById("screenGame");
      const sizeSelect = document.getElementById("sizeSelect");
      const menuBest = document.getElementById("menuBest");
      const btnStart = document.getElementById("btnStart");
      const btnBack = document.getElementById("btnBack");
      const gridEl = document.getElementById("grid");
      const gridMask = document.getElementById("gridMask");
      const maskCountdown = document.getElementById("maskCountdown");
      const nextNumEl = document.getElementById("nextNum");
      const nextLabelEl = document.getElementById("nextLabel");
      const timerDisplay = document.getElementById("timerDisplay");
      const bestDisplay = document.getElementById("bestDisplay");
      const resultBanner = document.getElementById("resultBanner");
      const hintText = document.getElementById("hintText");
      const btnRestart = document.getElementById("btnRestart");

      let n = 4;
      let numbers = [];
      let nextExpected = 1;
      let phase = "idle";
      let playStartTs = 0;
      let rafId = 0;
      let countdownTimer = null;
      let errorClearTimer = null;

      function storageKey(size) {
        return "schulte_best_sec_" + size;
      }

      function readBest(size) {
        const v = localStorage.getItem(storageKey(size));
        if (v == null || v === "") return null;
        const x = parseFloat(v);
        return Number.isFinite(x) ? x : null;
      }

      function writeBest(size, sec) {
        localStorage.setItem(storageKey(size), String(sec));
      }

      function formatSeconds(sec) {
        const s = Math.max(0, sec);
        const whole = Math.floor(s);
        const frac = Math.round((s - whole) * 100);
        const pad2 = function (x) {
          return x < 10 ? "0" + x : String(x);
        };
        return pad2(whole) + "." + pad2(frac) + " 秒";
      }

      function updateGameBestUI() {
        const b = readBest(n);
        bestDisplay.innerHTML =
          "本局尺寸最佳<br /><strong>" +
          (b == null ? "—" : formatSeconds(b).replace(" 秒", "") + " 秒") +
          "</strong>";
      }

      function updateMenuBestUI() {
        const sel = parseInt(sizeSelect.value, 10) || n;
        const b = readBest(sel);
        menuBest.innerHTML =
          "该尺寸最佳：<strong>" +
          (b == null ? "—" : formatSeconds(b).replace(" 秒", "") + " 秒") +
          "</strong>";
      }

      function showMenu() {
        clearCountdown();
        stopTimerLoop();
        if (errorClearTimer) {
          clearTimeout(errorClearTimer);
          errorClearTimer = null;
        }
        phase = "idle";
        gridMask.classList.add("hidden");
        screenGame.classList.add("hidden");
        screenMenu.classList.remove("hidden");
        updateMenuBestUI();
      }

      function showGame() {
        screenMenu.classList.add("hidden");
        screenGame.classList.remove("hidden");
      }

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = arr[i];
          arr[i] = arr[j];
          arr[j] = t;
        }
        return arr;
      }

      function buildNumbers() {
        const max = n * n;
        numbers = shuffle(Array.from({ length: max }, function (_, i) {
          return i + 1;
        }));
      }

      function cellColorIndex(row, col) {
        return (row + col) % PALETTE.length;
      }

      function renderGrid() {
        gridEl.style.setProperty("--n", String(n));
        gridEl.style.gridTemplateColumns = "repeat(" + n + ", 1fr)";
        gridEl.innerHTML = "";
        let idx = 0;
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            const num = numbers[idx++];
            const cell = document.createElement("button");
            cell.type = "button";
            cell.className = "cell";
            cell.dataset.value = String(num);
            const ci = cellColorIndex(r, c);
            const pal = PALETTE[ci];
            cell.style.background = pal.bg;
            cell.style.color = pal.fg;
            cell.textContent = String(num);
            cell.addEventListener("click", onCellClick);
            gridEl.appendChild(cell);
          }
        }
      }

      function setMaskVisible(on) {
        if (on) {
          gridMask.classList.remove("hidden");
          gridMask.setAttribute("aria-hidden", "false");
        } else {
          gridMask.classList.add("hidden");
          gridMask.setAttribute("aria-hidden", "true");
        }
      }

      function setPhase(p) {
        phase = p;
        const playing = p === "playing";
        const countdown = p === "countdown";
        const complete = p === "complete";

        gridEl.querySelectorAll(".cell").forEach(function (el) {
          if (complete || countdown) el.classList.add("disabled");
          else el.classList.remove("disabled");
        });

        btnRestart.disabled = countdown;
      }

      function stopTimerLoop() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
      }

      function tickTimer() {
        if (phase !== "playing" || !playStartTs) return;
        const elapsed = (performance.now() - playStartTs) / 1000;
        timerDisplay.textContent = formatSeconds(elapsed);
        rafId = requestAnimationFrame(tickTimer);
      }

      function resetTimerDisplay() {
        stopTimerLoop();
        timerDisplay.textContent = "00.00 秒";
      }

      function clearCountdown() {
        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }
      }

      function runCountdown(done) {
        clearCountdown();
        setPhase("countdown");
        setMaskVisible(true);
        maskCountdown.textContent = "3";
        const seq = ["3", "2", "1", "开始"];
        let i = 0;
        maskCountdown.textContent = seq[i];
        countdownTimer = setInterval(function () {
          i++;
          if (i < seq.length) {
            maskCountdown.textContent = seq[i];
          } else {
            clearCountdown();
            setMaskVisible(false);
            done();
          }
        }, 1000);
      }

      function startPlay() {
        nextExpected = 1;
        nextLabelEl.textContent = "下一个：";
        nextNumEl.textContent = "1";
        resultBanner.textContent = "";
        resetTimerDisplay();
        playStartTs = performance.now();
        setPhase("playing");
        rafId = requestAnimationFrame(tickTimer);
      }

      function bootstrapGame() {
        clearCountdown();
        stopTimerLoop();
        if (errorClearTimer) {
          clearTimeout(errorClearTimer);
          errorClearTimer = null;
        }
        n = parseInt(sizeSelect.value, 10) || 4;
        buildNumbers();
        renderGrid();
        hintText.textContent = "以升序从 1 到 " + n * n + " 依次点按数字";
        nextLabelEl.textContent = "下一个：";
        nextNumEl.textContent = "1";
        updateGameBestUI();
        runCountdown(startPlay);
      }

      function onCellClick(e) {
        const cell = e.currentTarget;
        if (phase === "countdown" || phase === "complete") return;
        if (phase !== "playing") return;

        const val = parseInt(cell.dataset.value, 10);
        if (val !== nextExpected) {
          cell.classList.remove("error");
          void cell.offsetWidth;
          cell.classList.add("error");
          if (errorClearTimer) clearTimeout(errorClearTimer);
          errorClearTimer = setTimeout(function () {
            cell.classList.remove("error");
          }, 500);
          return;
        }

        nextExpected++;
        if (nextExpected > n * n) {
          finishGame();
          return;
        }
        nextNumEl.textContent = String(nextExpected);
      }

      function finishGame() {
        stopTimerLoop();
        const elapsedSec = (performance.now() - playStartTs) / 1000;
        timerDisplay.textContent = formatSeconds(elapsedSec);
        nextLabelEl.textContent = "下一个：";
        nextNumEl.textContent = "已完成";
        setPhase("complete");

        const prev = readBest(n);
        let isNew = false;
        if (prev == null || elapsedSec < prev) {
          writeBest(n, elapsedSec);
          isNew = true;
        }
        updateGameBestUI();
        updateMenuBestUI();

        window.alert(
          "完成！用时 " +
            elapsedSec.toFixed(2) +
            " 秒" +
            (isNew ? "\n（新纪录！）" : "")
        );
        resultBanner.textContent =
          "本次用时：" +
          elapsedSec.toFixed(2) +
          " 秒" +
          (isNew ? " · 已刷新本尺寸最佳" : "");
      }

      function initSelect() {
        sizeSelect.innerHTML = "";
        SIZES.forEach(function (s) {
          const opt = document.createElement("option");
          opt.value = String(s);
          opt.textContent = s + "×" + s + "（1~" + s * s + "）";
          sizeSelect.appendChild(opt);
        });
        sizeSelect.value = String(n);
      }

      sizeSelect.addEventListener("change", function () {
        updateMenuBestUI();
      });

      btnStart.addEventListener("click", function () {
        n = parseInt(sizeSelect.value, 10) || 4;
        showGame();
        bootstrapGame();
      });

      btnBack.addEventListener("click", function () {
        clearCountdown();
        stopTimerLoop();
        setMaskVisible(false);
        phase = "idle";
        showMenu();
      });

      btnRestart.addEventListener("click", function () {
        if (phase === "countdown") return;
        bootstrapGame();
      });

      initSelect();
      updateMenuBestUI();
      showMenu();
    })();
  </script>
</body>
</html>
